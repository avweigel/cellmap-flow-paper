# B3 blockwise config: cellmap/fly_organelles_run07_700000 on jrc_hela-2.
# The harness rewrites the `workers` field per run; everything else is held
# fixed across worker counts.
#
# Dataset: jrc_hela-2 (Heinrich et al., Nature 2021), public S3.
# Model: cellmap/fly_organelles_run07_700000, public HuggingFace.

data_path: "s3://janelia-cosem-datasets/jrc_hela-2/jrc_hela-2.zarr/recon-1/em/fibsem-uint8/s1"
charge_group: "cellmap"
queue: "gpu_h100"

models:
  fly_organelles:
    type: huggingface
    repo: cellmap/fly_organelles_run07_700000

# run.py rewrites this per worker-count (inserts _n<NNNN> before .zarr) so each
# point in the sweep writes to a fresh container and no blocks are skipped.
output_path: "/nrs/cellmap/weigela/benchmarks/b3_strong_scaling/jrc_hela-2_fly_organelles.zarr/s1"
task_name: "b3_strong_scaling_jrc_hela-2_fly_organelles"

# Mandatory: cellmap-flow blockwise tracks block progress under tmp_dir. run.py
# rewrites this to a per-N subdir and wipes it before each run so every
# worker-count does a clean full pass (no skipped blocks => honest timings).
tmp_dir: "/nrs/cellmap/weigela/benchmarks/b3_strong_scaling/tmp/jrc_hela-2_fly_organelles"

# Replaced by run.py per N. Default kept for dry-run inspection.
workers: 1

# Strong scaling needs a FIXED, BOUNDED volume (without this, blockwise
# processes the entire dataset, so N=1 never finishes). offset/shape are in
# WORLD units (nm) and snap to the 8 nm output grid. The SAME box is used for
# jrc_mus-liver so the two curves are directly comparable. Calibrate the size
# so N=1 finishes in tens of minutes and N=128 still has enough blocks to keep
# every worker busy (see RUNBOOK B3 calibration note).
bounding_boxes:
  - offset: [0, 0, 0]
    shape: [8192, 8192, 8192]
separate_bounding_boxes_zarrs: true
