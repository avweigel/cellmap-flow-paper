# B3 blockwise config: cellmap/fly_organelles_run07_700000 on jrc_mus-liver.
# The harness rewrites the `workers` field per run; everything else is held
# fixed across worker counts.
#
# Tissue counterpart to jrc_hela-2_fly_organelles.yaml.
# Dataset: jrc_mus-liver (Heinrich et al., Nature 2021), public S3.
# Model: cellmap/fly_organelles_run07_700000, public HuggingFace.

data_path: "s3://janelia-cosem-datasets/jrc_mus-liver/jrc_mus-liver.zarr/recon-1/em/fibsem-uint8/s1"
charge_group: "cellmap"
queue: "gpu_h100"

models:
  fly_organelles:
    type: huggingface
    repo: cellmap/fly_organelles_run07_700000

# run.py rewrites this per worker-count (inserts _n<NNNN> before .zarr) so each
# point in the sweep writes to a fresh container and no blocks are skipped.
output_path: "/nrs/cellmap/weigela/benchmarks/b3_strong_scaling/jrc_mus-liver_fly_organelles.zarr/s1"
task_name: "b3_strong_scaling_jrc_mus-liver_fly_organelles"

# Replaced by run.py per N. Default kept for dry-run inspection.
workers: 1

# Fixed, bounded volume for strong scaling -- SAME box as jrc_hela-2 so the two
# curves are directly comparable (differences then reflect chunk-content and S3
# read-pattern variance, not volume size). World units (nm); snaps to 8 nm grid.
bounding_boxes:
  - offset: [0, 0, 0]
    shape: [8192, 8192, 8192]
separate_bounding_boxes_zarrs: true
