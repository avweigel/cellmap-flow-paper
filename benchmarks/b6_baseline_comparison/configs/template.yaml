# B6 shared config. Both run_baseline.py and run_cellmapflow.py read this.
#
# Same model, same input, same physical region for both pipelines:
#   - baseline (run_baseline.py): hand-rolled chunked PyTorch over a TorchScript
#     export of the model, ROIs expressed in VOXELS of the input array below.
#   - cellmap-flow (run_cellmapflow.py): server (first-view) + blockwise YAML
#     (full-volume), using the same HuggingFace model.
#
# Defaults below mirror the rest of the suite: jrc_hela-2 at s1 (~8 nm) with
# cellmap/fly_organelles_run07_700000. Tune the sub-volume so a full run
# finishes in tens of minutes; keep the baseline ROI and the blockwise
# bounding box (in cf_blockwise_jrc_hela-2.yaml) covering the SAME region.

# --- shared input + model ---
dataset: "jrc_hela-2"                              # label; tags result JSON so the aggregator groups per dataset
data_path: "/nrs/cellmap/data/jrc_hela-2/jrc_hela-2.zarr/recon-1/em/fibsem-uint8/s1"
hf_repo: "cellmap/fly_organelles_run07_700000"   # cellmap-flow side (server + blockwise)

# TorchScript model for the hand-rolled baseline. The fly_organelles HF repo
# ships model.ts directly (no export needed); RUNBOOK B6 has the download.
model_checkpoint: "/nrs/cellmap/weigela/b6/fly_organelles_run07_700000.ts"

# --- baseline chunking (run_baseline.py) ---
# The fly U-Net is a valid-conv model: a 178^3 input yields a 56^3 x 8-channel
# output. The baseline steps by the OUTPUT block (56^3) and reads a 178^3 input
# window centered on it (context = (178-56)/2 = 61 per side). These match the
# read_shape/write_shape cellmap-flow uses, so the two pipelines do equal work.
input_block_shape:  [178, 178, 178]
output_block_shape: [56, 56, 56]
out_channel: 0          # which of the 8 output channels the baseline writes
output_dtype: "float32"

# Time-to-first-view ROI (baseline): small region that "feels interactive."
# In VOXELS of data_path (s1).
first_view_roi_offset: [1024, 1024, 1024]
first_view_roi_shape:  [256, 256, 256]
first_view_output_path: "/nrs/cellmap/weigela/b6/baseline_first_view.zarr"

# Full-volume ROI (baseline): one contiguous sub-volume, in VOXELS of s1.
# 512^3 voxels at ~8 nm == 4096 nm per side; matches the blockwise bbox below.
full_volume_roi_offset: [0, 0, 0]
full_volume_roi_shape:  [512, 512, 512]
output_path: "/nrs/cellmap/weigela/b6/baseline_full.zarr"

# --- cellmap-flow first-view (run_cellmapflow.py launches the server) ---
# The server is `cellmap_flow_server <cf_model_type> --repo <hf_repo> -d <data_path> -p <port>`.
cf_model_type: "huggingface"
# server_dataset/scale/first_chunk build the poll URL:
#   http://127.0.0.1:<port>/<server_dataset>/s<server_scale>/<server_first_chunk>
# Defaults match B1's working setup (dataset "data", s1).
server_dataset: "data"
server_scale: 1
server_first_chunk: "0.0.0"
server_boot_timeout_s: 600
# cf_server_extra_flags: {"--name": "fly"}   # optional extra server flags

# --- cellmap-flow full-volume (run_cellmapflow.py dispatches blockwise) ---
cellmap_flow_blockwise_yaml: "benchmarks/b6_baseline_comparison/configs/cf_blockwise_jrc_hela-2.yaml"
