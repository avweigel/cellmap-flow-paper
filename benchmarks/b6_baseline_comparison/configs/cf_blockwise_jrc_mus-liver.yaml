# B6 cellmap-flow blockwise config -- tissue dataset (jrc_mus-liver),
# full-volume completion stage. Same model + block geometry as the hand-rolled
# baseline (template_jrc_mus-liver.yaml), restricted to one sub-volume.
#
# The bounding box covers the SAME physical region as the baseline's
# full_volume ROI (1024 s1-voxels * 8 nm == 8192 nm) and the same box used by the
# jrc_hela-2 config, so all B6 timings are comparable. run_cellmapflow.py
# rewrites `workers`, `output_path`, and `tmp_dir` per worker-count in a sweep;
# the values here are the base/dry-run defaults.

data_path: "/nrs/cellmap/data/jrc_mus-liver/jrc_mus-liver.zarr/recon-1/em/fibsem-uint8/s1"
charge_group: "cellmap"
queue: "gpu_h100"

models:
  fly_organelles:
    type: huggingface
    repo: cellmap/fly_organelles_run07_700000

output_path: "/nrs/cellmap/weigela/b6/cellmapflow_mus-liver_8192_full.zarr/s1"
task_name: "b6_cellmapflow_jrc_mus-liver_fly_organelles"
workers: 1

# Mandatory: blockwise tracks block progress here. run_cellmapflow.py rewrites
# this to a per-N subdir and wipes it before each run so every worker-count does
# a clean full pass (no skipped blocks => honest timings).
tmp_dir: "/nrs/cellmap/weigela/b6/tmp/cellmapflow_jrc_mus-liver_8192"

# One sub-volume (nanometers); same box as jrc_hela-2 and B3. 1024 s1-voxels *
# 8 nm == 8192 nm. separate_bounding_boxes_zarrs sizes the output array to the box
# rather than the whole dataset.
bounding_boxes:
  - offset: [0, 0, 0]
    shape: [8192, 8192, 8192]
separate_bounding_boxes_zarrs: true
