# B6 shared config -- tissue dataset (jrc_mus-liver).
#
# Tissue counterpart to template.yaml (jrc_hela-2). Same model, same block
# geometry, and the SAME physical sub-volume shape as the cell-culture config,
# so the two datasets' B6 numbers are directly comparable -- differences reflect
# chunk-content and read-pattern variance, not volume size or model.
#
# jrc_mus-liver is mouse liver tissue (Heinrich et al., Nature 2021), ~12x larger
# than jrc_hela-2 and too large to fit in main memory. Both run_baseline.py and
# run_cellmapflow.py read this file.

# --- shared input + model ---
dataset: "jrc_mus-liver"                            # label; tags result JSON so the aggregator groups per dataset
# Janelia /nrs mirror of the public S3 volume
# (s3://janelia-cosem-datasets/jrc_mus-liver/jrc_mus-liver.zarr); the baseline
# reads it directly with zarr.open, so a local mirror keeps timings honest.
data_path: "/nrs/cellmap/data/jrc_mus-liver/jrc_mus-liver.zarr/recon-1/em/fibsem-uint8/s1"
hf_repo: "cellmap/fly_organelles_run07_700000"      # cellmap-flow side (server + blockwise)

# TorchScript model for the hand-rolled baseline -- the same export used by the
# jrc_hela-2 config (one model spans both datasets). RUNBOOK B6 has the download.
model_checkpoint: "/nrs/cellmap/weigela/b6/fly_organelles_run07_700000.ts"

# --- baseline chunking (run_baseline.py) ---
# Identical to the jrc_hela-2 config: the fly U-Net is a valid-conv model, a
# 178^3 input yields a 56^3 x 8-channel output; the baseline steps by the 56^3
# OUTPUT block and reads a 178^3 input window (context = (178-56)/2 = 61/side).
input_block_shape:  [178, 178, 178]
output_block_shape: [56, 56, 56]
out_channel: 0          # which of the 8 output channels the baseline writes
output_dtype: "float32"

# Time-to-first-view ROI (baseline): small region that "feels interactive",
# in VOXELS of data_path (s1). Same shape as the cell-culture config.
first_view_roi_offset: [1024, 1024, 1024]
first_view_roi_shape:  [256, 256, 256]
first_view_output_path: "/nrs/cellmap/weigela/b6/mus-liver_baseline_first_view.zarr"

# Full-volume ROI (baseline): one contiguous sub-volume, in VOXELS of s1.
# 1024^3 voxels at ~8 nm == 8192 nm/side; matches the blockwise bbox below, the
# jrc_hela-2 config, and B3's strong-scaling sub-volume, so the two datasets do
# equal work and B6 shares B3's region.
full_volume_roi_offset: [0, 0, 0]
full_volume_roi_shape:  [1024, 1024, 1024]
output_path: "/nrs/cellmap/weigela/b6/mus-liver_baseline_8192_full.zarr"

# --- cellmap-flow first-view (run_cellmapflow.py launches the server) ---
cf_model_type: "huggingface"
server_dataset: "data"
server_scale: 1
server_first_chunk: "0.0.0"
server_boot_timeout_s: 600
# cf_server_extra_flags: {"--name": "fly"}   # optional extra server flags

# --- cellmap-flow full-volume (run_cellmapflow.py dispatches blockwise) ---
cellmap_flow_blockwise_yaml: "benchmarks/b6_baseline_comparison/configs/cf_blockwise_jrc_mus-liver.yaml"
